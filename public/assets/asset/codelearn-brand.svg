<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="128" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Main Green Accent Gradient -->
    <linearGradient id="emeraldGrad" x1="20" y1="20" x2="108" y2="108" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4ADE80" />
      <stop offset="50%" stop-color="#22C55E" />
      <stop offset="100%" stop-color="#15803D" />
    </linearGradient>

    <!-- Cyan/Mint Cyber Glow Gradient -->
    <linearGradient id="cyberGrad" x1="108" y1="20" x2="20" y2="108" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Outer Border Glow -->
    <linearGradient id="borderGrad" x1="0" y1="0" x2="128" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22C55E" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#065F46" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#22C55E" stop-opacity="0.4" />
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Squircle / Rounded Tech Container -->
  <rect x="4" y="4" width="120" height="120" rx="32" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2.5" />

  <!-- Background Cyber Circuit Accents -->
  <path d="M 28 36 L 44 36 L 50 42" stroke="#22C55E" stroke-opacity="0.15" stroke-width="2" stroke-linecap="round" fill="none" />
  <circle cx="28" cy="36" r="2" fill="#22C55E" fill-opacity="0.2" />
  <path d="M 100 92 L 84 92 L 78 86" stroke="#22C55E" stroke-opacity="0.15" stroke-width="2" stroke-linecap="round" fill="none" />
  <circle cx="100" cy="92" r="2" fill="#22C55E" fill-opacity="0.2" />

  <!-- Central Futuristic Shield & Code Glyph -->
  <!-- Left Code Bracket < with Shield Curve -->
  <path
    d="M 52 40 L 36 58 C 34 60.5 34 67.5 36 70 L 52 88 C 53.5 89.5 56 88.5 56 86.5 L 56 80 C 56 78.5 55 77.5 54 76 L 43.5 64 L 54 52 C 55 50.5 56 49.5 56 48 L 56 41.5 C 56 39.5 53.5 38.5 52 40 Z"
    fill="url(#emeraldGrad)"
    filter="url(#neonGlow)"
  />

  <!-- Right Code Bracket > with Shield Curve -->
  <path
    d="M 76 40 L 92 58 C 94 60.5 94 67.5 92 70 L 76 88 C 74.5 89.5 72 88.5 72 86.5 L 72 80 C 72 78.5 73 77.5 74 76 L 84.5 64 L 74 52 C 73 50.5 72 49.5 72 48 L 72 41.5 C 72 39.5 74.5 38.5 76 40 Z"
    fill="url(#emeraldGrad)"
    filter="url(#neonGlow)"
  />

  <!-- Center Dynamic Slash / Terminal Prompt / Shield Core -->
  <path
    d="M 71 36 L 53 92 C 52.5 93.5 54 95 55.5 95 L 61 95 C 62.5 95 63.5 94 64 92.5 L 82 36 C 82.5 34.5 81 33 79.5 33 L 74 33 C 72.5 33 71.5 34 71 36 Z"
    fill="url(#cyberGrad)"
    filter="url(#neonGlow)"
  />

  <!-- High-Tech Energy Spark Core -->
  <circle cx="64" cy="64" r="3.5" fill="#FFFFFF" opacity="0.9" filter="url(#neonGlow)" />
  <circle cx="64" cy="64" r="6" fill="#4ADE80" opacity="0.4" />
</svg>
